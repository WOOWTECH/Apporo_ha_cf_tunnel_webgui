---
# Forked from WOOWTECH's Cloudflared add-on with a Web GUI (1.1.3). Its own
# slug and image make it a separate add-on: it installs next to WOOW's (slug
# cloudflared) instead of replacing it, and it starts its own version line.
name: Apporo CF Tunnel Web
version: 1.0.0
slug: apporo_cf_tunnel_web
description: >-
  Connect an Apporo Security Access (Cloudflare Tunnel) to Home Assistant
  without opening ports, with a Web GUI
url: "https://github.com/WOOWTECH/apporo_ha_cf_tunnel_web"
image: "ghcr.io/woowtech/{arch}-addon-apporo-cf-tunnel-web"
startup: services
init: false
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
ingress_panel: true
panel_icon: mdi:cloud-lock-outline
panel_title: Apporo Tunnel
arch:
  - aarch64
  - amd64
map:
  - addon_config:rw
  - homeassistant_config
options:
  external_hostname: ""
  additional_hosts: []
ports:
  36500/tcp: null
schema:
  external_hostname: str?
  additional_hosts:
    - hostname: str
      service: str
      disableChunkedEncoding: bool?
  tunnel_name: str?
  catch_all_service: str?
  nginx_proxy_manager: bool?
  # password? instead of upstream's str?: identical values accepted, but the
  # HA configuration UI masks the secret instead of showing it in clear text.
  tunnel_token: password?
  post_quantum: bool?
  run_parameters:
    - match(^(--edge-bind-address|--edge-ip-version|--grace-period|--ha-connections|--logfile|--loglevel|--pidfile|--protocol|--region|--retries|--tag)=.*$)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
