---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "cloudflared/**"
      - ".github/workflows/build.yaml"
  # Pull requests run unfiltered, so a required check always reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Other runs queue per
  # branch and are never cancelled once started, so on main each run's version
  # guard sees the tags an earlier run pushed, and no version is published
  # twice. GitHub keeps one waiting run per group: a newer run replaces it, and
  # that newer run builds the same or a later main.
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('build-pr-{0}', github.ref)
    || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python and runtime script tests
    runs-on: ubuntu-24.04
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          # The add-on image runs the Web GUI on Alpine's Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            cloudflared/webgui/requirements-dev.txt
            cloudflared/webgui/backend/requirements.txt

      - name: Install test dependencies
        # PyYAML: cloudflared/tests/test_addon_identity.py reads config.yaml.
        run: python -m pip install -r cloudflared/webgui/requirements-dev.txt PyYAML==6.0.3

      - name: Web GUI tests
        working-directory: cloudflared/webgui
        run: python -m pytest -q

      - name: Add-on tests (identity, credential guard, secret logging)
        run: python -m pytest -q cloudflared/tests

      - name: API error probe (synthetic Supervisor, no secret in any response)
        run: python cloudflared/tests/ha05_api_error_probe.py cloudflared/webgui

      - name: Startup script tests (token file, resilience patches)
        run: |
          bash cloudflared/tests/test_token_safety.sh
          bash cloudflared/tests/test_resilience_patches.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloudflared/webgui/frontend
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The image builds the frontend on node:22-alpine.
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflared/webgui/frontend/package-lock.json

      - name: Install dependencies (lockfile only, no lifecycle scripts, as in the image)
        run: npm ci --ignore-scripts

      - name: Unit tests (vitest)
        run: npm test

      - name: Type check and build
        run: npm run build

  build:
    name: Build ${{ matrix.arch }} add-on
    needs:
      - python
      - frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    env:
      ARCH: ${{ matrix.arch }}
      # Only main publishes (a push, or a manual run on main). Everything else,
      # pull requests included, builds with --test, which never pushes.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: ℹ️ Read add-on version and image
        id: addon
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' cloudflared/config.yaml | tr -d "\"'")"
          image="$(sed -n 's/^image:[[:space:]]*//p' cloudflared/config.yaml | tr -d "\"'")"
          image="${image//\{arch\}/${ARCH}}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "::error::Cannot read the version and image from cloudflared/config.yaml"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "ref=${image}:${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Add-on ${version}, image ${image}:${version}, publish: ${PUBLISH}"

      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔑 Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails closed: a version counts as unpublished only when GHCR answers
      # 404 with MANIFEST_UNKNOWN or NAME_UNKNOWN. Any other answer (an auth
      # error, a rate limit, a 5xx, a timeout) is retried and then fails the
      # job, so a GHCR outage never gets a published version pushed again. The
      # registry API is asked directly because `docker manifest inspect`
      # reports a 401 or a non-JSON 5xx as "no such manifest" as well.
      - name: 🛡️ Guard against overwriting a published version tag
        id: guard
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.addon.outputs.image }}
          VERSION: ${{ steps.addon.outputs.version }}
          REF: ${{ steps.addon.outputs.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          # Ask for every manifest type: for a published image whose type the
          # Accept header leaves out, GHCR answers 404 MANIFEST_UNKNOWN too.
          accept="application/vnd.oci.image.index.v1+json"
          accept+=",application/vnd.oci.image.manifest.v1+json"
          accept+=",application/vnd.docker.distribution.manifest.list.v2+json"
          accept+=",application/vnd.docker.distribution.manifest.v2+json"
          body="${RUNNER_TEMP}/guard-manifest.json"
          # Prints the HTTP status of the manifest request, with the answer in
          # ${body}; fails when there is no token or no answer (curl says why).
          manifest_status() {
            local token
            # Credentials reach curl through --config files, not its arguments.
            token="$(curl -sS --fail --max-time 30 \
              --config <(printf 'user = "%s:%s"\n' "${GITHUB_REPOSITORY_OWNER}" "${GITHUB_TOKEN}") \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -er .token)" || return 1
            curl -sS --max-time 30 --output "${body}" --write-out '%{http_code}' \
              --config <(printf 'header = "Authorization: Bearer %s"\n' "${token}") \
              --header "Accept: ${accept}" "https://ghcr.io/v2/${repo}/manifests/${VERSION}"
          }
          for attempt in 1 2 3; do
            rm -f "${body}"
            if status="$(manifest_status)"; then
              if [[ "${status}" == 200 ]]; then
                echo "exists=true" >> "$GITHUB_OUTPUT"
                echo "::warning::${REF} already exists, so nothing is published." \
                  "Bump the version in cloudflared/config.yaml to release."
                exit 0
              fi
              # A 404 that names the Accept header means the image exists in a
              # type this request left out, so it does not count as absent.
              if [[ "${status}" == 404 ]] && jq -e '
                  (.errors | length > 0) and all(.errors[];
                    (.code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN")
                    and ((.message // "") | test("accept"; "i") | not))
                ' "${body}" > /dev/null 2>&1; then
                echo "exists=false" >> "$GITHUB_OUTPUT"
                echo "${REF} is not published yet, so this run publishes it."
                exit 0
              fi
              answer="HTTP ${status}: $(head -c 300 "${body}" 2>/dev/null | tr -d '\r\n')"
            else
              answer="no usable answer from ghcr.io, see curl's error above"
            fi
            echo "Attempt ${attempt} of 3: cannot tell whether ${REF} is published (${answer})"
            if (( attempt < 3 )); then sleep 15; fi
          done
          echo "::error::Cannot tell whether ${REF} is published, so nothing is published." \
            "Re-run the job once ghcr.io answers normally. Last answer: ${answer}"
          exit 1

      - name: 🚀 Build ${{ matrix.arch }} add-on
        id: build
        if: env.PUBLISH != 'true' || steps.guard.outputs.exists == 'false'
        # 2026.02.1 is the last release with a matching amd64-builder image on
        # GHCR; newer tags have no image, and a SHA pin fails because the
        # action pulls amd64-builder:<ref>. On main the builder pushes
        # <version> and latest to the image in config.yaml.
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            ${{ env.PUBLISH != 'true' && '--test' || '' }} \
            --${{ matrix.arch }} \
            --target cloudflared \
            --addon

      # The builder runs on the host Docker daemon, so the image it built stays
      # there under its config.yaml name, --test or not. The probe starts the
      # image's Web GUI on its own Python with a synthetic Supervisor, offline.
      - name: Smoke test the amd64 image (Web GUI API and static files)
        if: matrix.arch == 'amd64' && steps.build.outcome == 'success'
        env:
          REF: ${{ steps.addon.outputs.ref }}
        run: |
          docker run --rm --network none \
            --volume "${PWD}/cloudflared/tests/ha05_api_error_probe.py:/probe.py:ro" \
            --entrypoint python3 "${REF}" /probe.py
