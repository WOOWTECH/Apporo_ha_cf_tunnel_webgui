---
name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - "cloudflared/**"
      - ".github/workflows/build.yaml"
  # Pull requests run unfiltered, so a required check always reports.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Other runs queue per
  # branch and are never cancelled once started, so on main each run's version
  # guard sees the tags an earlier run pushed, and no version is published
  # twice. GitHub keeps one waiting run per group: a newer run replaces it, and
  # that newer run builds the same or a later main.
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('build-pr-{0}', github.ref)
    || format('build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python and runtime script tests
    runs-on: ubuntu-24.04
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          # The add-on image runs the Web GUI on Alpine's Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            cloudflared/webgui/requirements-dev.txt
            cloudflared/webgui/backend/requirements.txt

      - name: Install test dependencies
        # PyYAML: cloudflared/tests/test_addon_identity.py reads config.yaml.
        run: python -m pip install -r cloudflared/webgui/requirements-dev.txt PyYAML==6.0.3

      - name: Web GUI tests
        working-directory: cloudflared/webgui
        run: python -m pytest -q

      - name: Add-on tests (identity, credential guard, secret logging)
        run: python -m pytest -q cloudflared/tests

      - name: API error probe (synthetic Supervisor, no secret in any response)
        run: python cloudflared/tests/ha05_api_error_probe.py cloudflared/webgui

      - name: Startup script tests (token file, resilience patches)
        run: |
          bash cloudflared/tests/test_token_safety.sh
          bash cloudflared/tests/test_resilience_patches.sh

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloudflared/webgui/frontend
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The image builds the frontend on node:22-alpine.
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflared/webgui/frontend/package-lock.json

      - name: Install dependencies (lockfile only, no lifecycle scripts, as in the image)
        run: npm ci --ignore-scripts

      - name: Unit tests (vitest)
        run: npm test

      - name: Type check and build
        run: npm run build

  build:
    name: Build ${{ matrix.arch }} add-on
    needs:
      - python
      - frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
    env:
      ARCH: ${{ matrix.arch }}
      # Only main publishes (a push, or a manual run on main). Everything else,
      # pull requests included, builds with --test, which never pushes.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v4

      - name: ℹ️ Read add-on version and image
        id: addon
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' cloudflared/config.yaml | tr -d "\"'")"
          image="$(sed -n 's/^image:[[:space:]]*//p' cloudflared/config.yaml | tr -d "\"'")"
          image="${image//\{arch\}/${ARCH}}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "${image}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "::error::Cannot read the version and image from cloudflared/config.yaml"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${image}:${version}" >> "$GITHUB_OUTPUT"
          echo "Add-on ${version}, image ${image}:${version}, publish: ${PUBLISH}"

      - name: 🏗 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔑 Login to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛡️ Guard against overwriting a published version tag
        id: guard
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.addon.outputs.ref }}
        run: |
          if docker manifest inspect "${REF}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${REF} already exists, so nothing is published." \
              "Bump the version in cloudflared/config.yaml to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Build ${{ matrix.arch }} add-on
        id: build
        if: env.PUBLISH != 'true' || steps.guard.outputs.exists == 'false'
        # 2026.02.1 is the last release with a matching amd64-builder image on
        # GHCR; newer tags have no image, and a SHA pin fails because the
        # action pulls amd64-builder:<ref>. On main the builder pushes
        # <version> and latest to the image in config.yaml.
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            ${{ env.PUBLISH != 'true' && '--test' || '' }} \
            --${{ matrix.arch }} \
            --target cloudflared \
            --addon

      # The builder runs on the host Docker daemon, so the image it built stays
      # there under its config.yaml name, --test or not. The probe starts the
      # image's Web GUI on its own Python with a synthetic Supervisor, offline.
      - name: Smoke test the amd64 image (Web GUI API and static files)
        if: matrix.arch == 'amd64' && steps.build.outcome == 'success'
        env:
          REF: ${{ steps.addon.outputs.ref }}
        run: |
          docker run --rm --network none \
            --volume "${PWD}/cloudflared/tests/ha05_api_error_probe.py:/probe.py:ro" \
            --entrypoint python3 "${REF}" /probe.py
